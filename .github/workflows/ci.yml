name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        run: node --check src/cli.js && node --check src/api.js && node --check src/compare.js && node --check src/format.js && node --check src/goma.js && node --check src/retry.js && node --check src/session.js && node --check src/version.js

      # The tests are hermetic: every network call is stubbed, so CI never
      # touches nemlig.com or goma.gg.
      - name: Test
        run: npm test

      - name: CLI starts and reports its version
        run: node src/cli.js --version

  link:
    name: npm link works
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm link
      - run: nemlig --help
